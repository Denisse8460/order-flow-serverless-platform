AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: OrderFlow - Resilient serverless order processing platform

Parameters:
  DynamoDBTableName:
    Type: String
    Default: orderflow-orders-dev

  OrderQueueArn:
    Type: String
    Description: ARN of the existing OrderFlow SQS queue

  OrderQueueUrl:
    Type: String
    Description: URL of the existing OrderFlow SQS queue

  OrderQueueName:
    Type: String
    Default: orderflow-orders-dev

  OrderDlqName:
    Type: String
    Default: orderflow-orders-dlq-dev

  AllowedOrigins:
    Type: String
    Default: "http://localhost:5173,http://127.0.0.1:5173,https://main.d3ggtltr5kolu8.amplifyapp.com"


Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 256
    Architectures:
      - x86_64


Resources:

  OrderFlowHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"


  OrderApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: orderflow-api-dev

      CodeUri: .lambda-package/

      Handler: src.handlers.api_handler.lambda_handler

      Environment:
        Variables:
          ORDERFLOW_REPOSITORY: dynamodb
          ORDERFLOW_QUEUE: sqs
          ORDERFLOW_AWS_REGION: !Ref AWS::Region
          ORDERFLOW_DYNAMODB_TABLE: !Ref DynamoDBTableName
          ORDERFLOW_SQS_QUEUE_URL: !Ref OrderQueueUrl
          ORDERFLOW_ALLOWED_ORIGINS: !Ref AllowedOrigins

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DynamoDBTableName

        - Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !Ref OrderQueueArn

      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrderFlowHttpApi


  OrderProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: orderflow-order-processor-dev

      CodeUri: .lambda-package/

      Handler: src.handlers.process_order_handler.lambda_handler

      Environment:
        Variables:
          ORDERFLOW_DYNAMODB_TABLE: !Ref DynamoDBTableName

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DynamoDBTableName

        - Statement:
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
                - sqs:ChangeMessageVisibility
              Resource: !Ref OrderQueueArn

      Events:
        OrderQueue:
          Type: SQS
          Properties:
            Queue: !Ref OrderQueueArn
            BatchSize: 10
            Enabled: true
            FunctionResponseTypes:
              - ReportBatchItemFailures


  OrderFlowAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: orderflow-alerts-dev
      DisplayName: OrderFlow Alerts


  OrderDlqMessagesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: orderflow-dlq-messages-dev

      AlarmDescription: >
        Alarm when OrderFlow has one or more messages
        in the dead-letter queue.

      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible

      Dimensions:
        - Name: QueueName
          Value: !Ref OrderDlqName

      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1

      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

      AlarmActions:
        - !Ref OrderFlowAlertsTopic

      OKActions:
        - !Ref OrderFlowAlertsTopic


  OrderQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: orderflow-queue-age-dev

      AlarmDescription: >
        Alarm when the oldest OrderFlow message
        has waited more than five minutes.

      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage

      Dimensions:
        - Name: QueueName
          Value: !Ref OrderQueueName

      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1

      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

      AlarmActions:
        - !Ref OrderFlowAlertsTopic

      OKActions:
        - !Ref OrderFlowAlertsTopic


  OrderApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: orderflow-api-errors-dev

      AlarmDescription: >
        Alarm when the OrderFlow API Lambda
        reports one or more errors.

      Namespace: AWS/Lambda
      MetricName: Errors

      Dimensions:
        - Name: FunctionName
          Value: !Ref OrderApiFunction

      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1

      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

      AlarmActions:
        - !Ref OrderFlowAlertsTopic

      OKActions:
        - !Ref OrderFlowAlertsTopic


Outputs:

  OrderApiFunctionArn:
    Description: ARN of the OrderFlow API Lambda
    Value: !GetAtt OrderApiFunction.Arn

  OrderProcessorFunctionArn:
    Description: ARN of the OrderFlow processor Lambda
    Value: !GetAtt OrderProcessorFunction.Arn

  OrderFlowApiUrl:
    Description: Public URL of the OrderFlow API
    Value: !Sub "https://${OrderFlowHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"

  OrderDlqMessagesAlarmName:
    Description: Name of the OrderFlow DLQ alarm
    Value: !Ref OrderDlqMessagesAlarm

  OrderQueueAgeAlarmName:
    Description: Name of the OrderFlow queue age alarm
    Value: !Ref OrderQueueAgeAlarm

  OrderApiErrorsAlarmName:
    Description: Name of the OrderFlow API errors alarm
    Value: !Ref OrderApiErrorsAlarm

  OrderFlowAlertsTopicArn:
    Description: ARN of the OrderFlow SNS alerts topic
    Value: !Ref OrderFlowAlertsTopic